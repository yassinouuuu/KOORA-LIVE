<!-- admin.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="kx9eS1NWjqXit06POhFZ65KL6H1XvCKOUtcYluLJSDI" />
    <title>Yalla Goal - تسجيل الدخول</title>
    <link rel="icon" href="/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="shortcut icon" href="/logo.png" type="image/x-icon">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="admin-container">
        <div class="logo" style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:40px;">
            <img src="/logo.png" alt="Yalla Goal Admin" style="height: 60px; border-radius: 10px; box-shadow: 0 0 20px rgba(63, 94, 251, 0.5);">
            <span style="font-weight: 900; font-size: 2rem; color: #fff; letter-spacing: 1px;">Yalla<span style="color: #fc466b;">Goal</span></span>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn-primary">دخول <i class="fas fa-sign-in-alt"></i></button>
        </form>
        <p id="errorMsg" style="color: #ff4d4d; margin-top: 20px; text-align: center; display: none;"></p>
        
        <div style="text-align: center; margin-top: 30px;">
            <a href="/" style="color: var(--text-dim); text-decoration: none;"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
