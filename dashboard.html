<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأدمين - إدارة القنوات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Basic protection check before loading
        if (localStorage.getItem("adminAuth") !== "true") {
            window.location.href = "admin.html";
        }
    </script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-play-circle"></i>
                <span>KOORA<span>LIVE Admin</span></span>
            </div>
            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="#" onclick="logout()" class="admin-link"><i class="fas fa-sign-out-alt"></i> خروج</a>
            </div>
        </div>
    </nav>

    <main class="container" style="margin-top: 50px;">
        <div class="hero">
            <h1>إدارة القنوات</h1>
            <p>أضف أو احذف قنوات البث المباشر بكل سهولة</p>
        </div>

        <div class="admin-card">
            <h2><i class="fas fa-plus-circle"></i> إضافة قناة جديدة</h2>
            <form id="addChannelForm" style="margin-top: 20px;">
                <div class="form-group">
                    <label>اسم القناة</label>
                    <input type="text" id="channelName" placeholder="مثال: beIN Sport 1" required>
                </div>
                <div class="form-group">
                    <label>كود IFRAME</label>
                    <textarea id="channelIframe" placeholder="ألصق كود الـ IFRAME هنا" required></textarea>
                </div>
                <button type="button" id="btnTest" class="btn-test"><i class="fas fa-vial"></i> تجربة القناة قبل الحفظ</button>
                <div id="previewBox" class="preview-box" style="display:none; margin-top: 20px;">
                    <div class="player-wrapper" id="previewWrapper"></div>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 20px;">حفظ القناة <i class="fas fa-save"></i></button>
            </form>
        </div>

        <div class="admin-card">
            <h2><i class="fas fa-list"></i> القنوات الحالية</h2>
            <div id="adminChannelsList" class="channels-manage-list">
                <!-- Channels will list here -->
            </div>
        </div>

        <div class="admin-card">
            <h2><i class="fas fa-futbol"></i> إضافة مباراة</h2>
            <form id="addMatchForm">

                <div class="form-group" style="display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end;">
                    <div>
                        <label>اسم الفريق الأول</label>
                        <input type="text" id="matchHome" placeholder="مثال: ريال مدريد" required>
                    </div>
                    <img id="previewHomeLogo" src="" style="width:48px;height:48px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,0.05);padding:4px;" onerror="this.style.opacity='0'" onload="this.style.opacity='1'">
                </div>
                <div class="form-group">
                    <label>رابط شعار الفريق الأول</label>
                    <input type="text" id="matchHomeBadge" placeholder="https://...jpg أو png">
                </div>

                <div class="form-group" style="display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end;">
                    <div>
                        <label>اسم الفريق الثاني</label>
                        <input type="text" id="matchAway" placeholder="مثال: برشلونة" required>
                    </div>
                    <img id="previewAwayLogo" src="" style="width:48px;height:48px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,0.05);padding:4px;" onerror="this.style.opacity='0'" onload="this.style.opacity='1'">
                </div>
                <div class="form-group">
                    <label>رابط شعار الفريق الثاني</label>
                    <input type="text" id="matchAwayBadge" placeholder="https://...jpg أو png">
                </div>

                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>الوقت</label>
                        <input type="time" id="matchTime" required>
                    </div>
                    <div>
                        <label>البطولة</label>
                        <input type="text" id="matchLeague" placeholder="مثال: دوري أبطال أوروبا" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>كود الـ IFRAME أو رابط البث</label>
                    <textarea id="matchIframe" placeholder="ألصق كود المشغل هنا" required></textarea>
                </div>

                <button type="submit" class="btn-primary">حفظ المباراة <i class="fas fa-save"></i></button>
            </form>
        </div>

        <div class="admin-card">
            <h2><i class="fas fa-tasks"></i> مباريات اليوم الحالية</h2>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button id="btnFixLogos" class="btn-test" style="width:auto; padding:8px 20px;"><i class="fas fa-sync"></i> إصلاح الشعارات</button>
                <button onclick="clearAllMatches()" class="btn-delete" style="padding:8px 20px;"><i class="fas fa-trash"></i> حذف الكل</button>
            </div>
            <div id="adminMatchesList" class="channels-manage-list">
                <!-- Matches will list here -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 جميع الحقوق محفوظة لـ KOORA LIVE</p>
        </div>
    </footer>

    <script src="teams-db.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
