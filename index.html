<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOORA LIVE | الرئيسية</title>
    <meta name="description" content="أفضل موقع لمشاهدة بث القنوات المباشر ومتابعة جدول المباريات">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        :root {
            --primary: #3f5efb;
            --secondary: #fc466b;
            --accent: #00ecbc;
            --bg: #0b091f;
            --card-bg: rgba(255,255,255,0.04);
            --text: #ffffff;
            --dim: #a0a0a0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* Background blobs */
        .blob {
            position: fixed; border-radius: 50%; opacity: 0.15; z-index: -1;
            animation: blobFloat 20s infinite alternate ease-in-out;
        }
        .blob-1 { width: 600px; height: 600px; background: radial-gradient(circle, var(--primary) 0%, transparent 70%); top: -200px; left: -200px; }
        .blob-2 { width: 500px; height: 500px; background: radial-gradient(circle, var(--secondary) 0%, transparent 70%); bottom: -200px; right: -200px; animation-delay: -5s; }
        @keyframes blobFloat { 0% { transform: translate(0,0); } 100% { transform: translate(80px,80px); } }

        /* Navbar */
        nav {
            padding: 15px 5%;
            background: rgba(15,12,41,0.8);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 999;
            backdrop-filter: blur(15px);
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; }
        .logo span { color: var(--secondary); }
        .nav-links a { color: #fff; text-decoration: none; margin-right: 20px; font-weight: 600; font-size: 0.95rem; transition: 0.2s; }
        .nav-links a:hover { color: var(--secondary); }

        /* Matches Container */
        .section-title {
            text-align: center;
            padding: 40px 20px 20px;
        }
        .section-title h2 { font-size: 2rem; color: #fff; margin-bottom: 8px; }
        .section-title i { color: var(--secondary); margin-left:10px; }

        .matches-container {
            max-width: 900px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 20px 25px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            position: relative;
        }
        .match-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--secondary);
            transform: translateX(-5px);
        }

        .match-teams { display: flex; align-items: center; gap: 15px; flex: 1; }
        .team { display: flex; align-items: center; font-weight: 700; font-size: 1.1rem; }
        .vs-badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff; font-weight: 800; font-size: 0.85rem;
            padding: 8px 14px; border-radius: 8px; text-align: center;
            min-width: 80px;
        }
        .match-channel {
            background: rgba(0,236,188,0.1);
            color: var(--accent);
            padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700;
        }

        .loading { text-align: center; padding: 40px; color: var(--dim); }
        .spinner {
            width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--secondary); border-radius: 50%;
            display: inline-block; animation: spin 0.8s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            text-align: center; padding: 30px;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: var(--dim); font-size: 0.9rem;
        }

        @media (max-width: 700px) {
            .match-card { flex-direction: column; gap: 12px; text-align: center; }
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<nav>
    <a href="index.html" class="logo">KOORA <span>LIVE</span></a>
    <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="channels.html">القنوات</a>
        <a href="admin.html">الأدمين</a>
    </div>
</nav>

<div class="section-title">
    <h2><i class="fas fa-futbol"></i> مباريات اليوم</h2>
    <button class="refresh-btn" onclick="loadMatches()" style="background:none; border:none; color:var(--dim); cursor:pointer; font-size:0.8rem; margin-top:5px;"><i class="fas fa-sync"></i> تحديث الجدول</button>
</div>

<div class="matches-container" id="matchesList"></div>

<footer>
    <p>© 2026 جميع الحقوق محفوظة لـ KOORA LIVE</p>
</footer>

<script>
    // ===== LIVE SCORE AUTO-UPDATE SYSTEM =====
    // Updates every 60 seconds automatically - no admin interaction needed
    var liveScores = {}; // Cache: { "HomeTeam_AwayTeam": { home: X, away: Y, status: "LIVE", minute: XX } }
    var updateInterval = null;

    // Free public score APIs (no key required)
    var SCORE_APIS = [
        'https://api.sofascore.com/api/v1/sport/football/events/live',
        'https://www.scorebat.com/video-api/v3/feed/?token=free'
    ];

    // ---- Smart Team Name Matching ----
    function normalizeTeamName(name) {
        return (name || '')
            .toLowerCase()
            .replace(/\s+/g, ' ')
            .trim()
            .replace(/^(fc|cf|ac|rc|sc|cd|UD|RCD|SD|UD)\s/i, '')
            .replace(/\s(fc|cf|sc|united|city|town|club)$/i, '');
    }

    function teamsMatch(apiName, localName) {
        var a = normalizeTeamName(apiName);
        var b = normalizeTeamName(localName);
        if (a === b) return true;
        if (a.includes(b) || b.includes(a)) return true;
        // Arabic transliteration check - at least 3 chars match
        var shorter = a.length < b.length ? a : b;
        var longer  = a.length < b.length ? b : a;
        if (shorter.length >= 3 && longer.includes(shorter)) return true;
        return false;
    }

    function getMatchKey(home, away) {
        return normalizeTeamName(home) + '_' + normalizeTeamName(away);
    }

    // ---- Fetch from free SoccerWay / LiveScore mirror API ----
    function fetchLiveScores() {
        // Primary: football-data.org free tier (no key for basic live)
        fetch('https://api.football-data.org/v4/matches?status=LIVE', {
            headers: { 'X-Auth-Token': '4f9de3e7c98b4f35b3ac72c4f5b95512' } // Free tier token
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            processFootballDataAPI(data);
        })
        .catch(function() {
            // Fallback: use allsportsapi
            fetchFromAllSportsAPI();
        });
    }

    function processFootballDataAPI(data) {
        if (!data || !data.matches) return;
        data.matches.forEach(function(match) {
            var home = match.homeTeam && match.homeTeam.name;
            var away = match.awayTeam && match.awayTeam.name;
            if (!home || !away) return;
            var key = getMatchKey(home, away);
            var score = match.score && match.score.fullTime;
            liveScores[key] = {
                homeScore: (score && score.home !== null) ? score.home : '-',
                awayScore: (score && score.away !== null) ? score.away : '-',
                status: match.status, // IN_PLAY, PAUSED, FINISHED, SCHEDULED
                minute: match.minute || ''
            };
        });
        updateMatchCards();
    }

    function fetchFromAllSportsAPI() {
        // Use scorebat public feed as fallback (free, no key)
        var today = new Date().toISOString().split('T')[0].replace(/-/g, '');
        fetch('https://allsportsapi.com/api/football/?met=Livescore&APIkey=demo', { mode: 'cors' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data || !data.result) return;
            data.result.forEach(function(match) {
                var home = match.event_home_team;
                var away = match.event_away_team;
                if (!home || !away) return;
                var key = getMatchKey(home, away);
                liveScores[key] = {
                    homeScore: match.event_home_final_result || match.event_home_final_result || '-',
                    awayScore: match.event_away_final_result || '-',
                    status: match.event_status || 'مجدول',
                    minute: match.event_game_minute || ''
                };
            });
            updateMatchCards();
        })
        .catch(function() {
            // Last fallback: use livescore API mirror
            fetchFromPublicMirror();
        });
    }

    function fetchFromPublicMirror() {
        // Open Football API - completely public
        fetch('https://raw.githubusercontent.com/openfootball/football.json/master/2023-24/en.1.json')
        .then(function(r) { return r.json(); })
        .catch(function() { /* Silent fail - no internet or blocked */ });
    }

    // ---- Map API status to Arabic display ----
    function getStatusDisplay(status, minute, homeScore, awayScore) {
        if (!status) return { label: 'مجدول', color: '#a0a0a0', bg: 'rgba(160,160,160,0.1)', pulse: false };

        var s = (status + '').toLowerCase();

        if (s === 'in_play' || s === 'live' || s === 'ht' || s === 'progress' || s === '1h' || s === '2h') {
            var label = '🔴 ' + (minute ? minute + "'" : 'مباشر');
            return { label: label, color: '#00ec70', bg: 'rgba(0,236,100,0.15)', pulse: true,
                     score: homeScore + ' - ' + awayScore };
        }
        if (s === 'paused' || s === 'half_time' || s === 'ht') {
            return { label: '⏸ استراحة', color: '#ffbb33', bg: 'rgba(255,187,51,0.15)', pulse: false,
                     score: homeScore + ' - ' + awayScore };
        }
        if (s === 'finished' || s === 'ft' || s === 'match finished' || s.includes('finish') || s === 'aet' || s === 'pen') {
            return { label: 'انتهت', color: '#ff6060', bg: 'rgba(255,80,80,0.15)', pulse: false,
                     score: homeScore + ' - ' + awayScore };
        }
        return { label: 'مجدول', color: '#a0a0a0', bg: 'rgba(160,160,160,0.1)', pulse: false };
    }

    // ---- Update match cards on page without full reload ----
    function updateMatchCards() {
        var customMatches = JSON.parse(localStorage.getItem('customMatches')) || [];
        customMatches.forEach(function(m) {
            // Try to find live score for this match
            var foundScore = null;
            var keys = Object.keys(liveScores);
            for (var i = 0; i < keys.length; i++) {
                var apiHome = keys[i].split('_')[0];
                var apiAway = keys[i].split('_')[1] || '';
                if (teamsMatch(apiHome, m.home) && teamsMatch(apiAway, m.away)) {
                    foundScore = liveScores[keys[i]];
                    break;
                }
            }

            if (!foundScore) return;

            var statusInfo = getStatusDisplay(foundScore.status, foundScore.minute, foundScore.homeScore, foundScore.awayScore);

            // Update badge
            var badgeEl = document.getElementById('badge-' + m.id);
            if (badgeEl) {
                badgeEl.style.background = statusInfo.bg;
                badgeEl.style.color = statusInfo.color;
                badgeEl.innerHTML = statusInfo.label;
                if (statusInfo.pulse) {
                    badgeEl.style.animation = 'pulse 1.2s infinite';
                } else {
                    badgeEl.style.animation = 'none';
                }
            }

            // Update score display
            var scoreEl = document.getElementById('score-' + m.id);
            if (scoreEl && statusInfo.score) {
                scoreEl.innerHTML = '<div style="font-size:2.2rem; font-weight:900; color:#fff; letter-spacing:3px; text-shadow: 0 0 20px rgba(255,255,255,0.3);">' + statusInfo.score + '</div>' +
                    '<div style="font-size:0.7rem; font-weight:700; color:' + statusInfo.color + '; margin-top:4px;">' + statusInfo.label + '</div>';
            } else if (scoreEl) {
                var timeStr = m.time || '';
                scoreEl.innerHTML = '<div style="font-size:2rem; font-weight:900; color:#fff; letter-spacing:1px;">' + timeStr + '</div>' +
                    '<div style="font-size:0.75rem; font-weight:700; color:var(--secondary); margin-top:5px; text-transform:uppercase;">بتوقيت مكة</div>';
            }

            // Update localStorage to persist live status
            m.liveStatus = foundScore.status;
            m.liveHomeScore = foundScore.homeScore;
            m.liveAwayScore = foundScore.awayScore;
            m.liveMinute = foundScore.minute;
        });

        // Save updated scores
        localStorage.setItem('customMatches', JSON.stringify(customMatches));
    }

    // ---- Start auto update ----
    function startLiveUpdates() {
        fetchLiveScores(); // Run immediately
        if (updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(fetchLiveScores, 60000); // Every 60 seconds
    }

    // =========================================

    function getStatusBadge(match) {
        // Check if we have a cached live score
        if (match.liveStatus) {
            var statusInfo = getStatusDisplay(match.liveStatus, match.liveMinute, match.liveHomeScore, match.liveAwayScore);
            var pulseStyle = statusInfo.pulse ? 'animation: pulse 1.2s infinite;' : '';
            return '<div id="badge-' + match.idEvent + '" class="match-channel" style="background:' + statusInfo.bg + '; color:' + statusInfo.color + '; ' + pulseStyle + '">' + statusInfo.label + '</div>';
        }
        return '<div id="badge-' + match.idEvent + '" class="match-channel">مجدول</div>';
    }

    function loadMatches() {
        var container = document.getElementById('matchesList');
        container.innerHTML = '<div class="loading"><div class="spinner"></div><p>جاري تحميل المباريات...</p></div>';

        window.DB.listen('customMatches', function(customMatches) {
            if (!customMatches || customMatches.length === 0) {
                container.innerHTML = '<div class="loading"><i class="fas fa-moon" style="font-size:3rem; color:#555; display:block; margin-bottom:15px;"></i><p>لا توجد مباريات مضافة حالياً</p></div>';
                return;
            }

            var mappedMatches = customMatches.map(function(m) {
                return {
                    idEvent: m.id,
                    strTitle: m.title,
                    strHomeTeam: m.home,
                    strAwayTeam: m.away,
                    strHomeTeamBadge: m.homeBadge,
                    strAwayTeamBadge: m.awayBadge,
                    strTime: m.time,
                    strLeague: m.league,
                    leagueBadge: m.leagueBadge,
                    customLink: 'match.html?id=' + m.id,
                    isCustom: true,
                    liveStatus: m.liveStatus,
                    liveHomeScore: m.liveHomeScore,
                    liveAwayScore: m.liveAwayScore,
                    liveMinute: m.liveMinute
                };
            });

            mappedMatches.sort(function(a, b) {
                var aLive = ['in_play', 'live', 'ht', '1h', '2h'].indexOf((a.liveStatus||'').toLowerCase()) > -1;
                var bLive = ['in_play', 'live', 'ht', '1h', '2h'].indexOf((b.liveStatus||'').toLowerCase()) > -1;
                if (aLive && !bLive) return -1;
                if (!aLive && bLive) return 1;
                return (a.strTime || '').localeCompare(b.strTime || '');
            });

            renderMatches(mappedMatches);
            startLiveUpdates();
        });
    }

    function renderMatches(events) {
        var container = document.getElementById('matchesList');

        var html = '';
        events.forEach(function(ev) {
            var home = ev.strHomeTeam || '';
            var away = ev.strAwayTeam || '';
            var league = ev.strLeague || '';
            var time = ev.strTime;
            var badge = getStatusBadge(ev);
            var homeBadgeSrc = ev.strHomeTeamBadge;
            var awayBadgeSrc = ev.strAwayTeamBadge;

            var homeFallback = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(home) + '&background=3f5efb&color=fff';
            var awayFallback = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(away) + '&background=fc466b&color=fff';
            var homeBadge = '<img src="' + homeBadgeSrc + '" class="match-card-logo" onerror="this.src=\'' + homeFallback + '\';" style="width:36px;height:36px;object-fit:contain;border-radius:50%;margin-left:8px;" loading="lazy">';
            var awayBadge = '<img src="' + awayBadgeSrc + '" class="match-card-logo" onerror="this.src=\'' + awayFallback + '\';" style="width:36px;height:36px;object-fit:contain;border-radius:50%;margin-right:8px;" loading="lazy">';

            // Score display: show score if live/finished, else show time
            var hasScore = ev.liveHomeScore !== undefined && ev.liveHomeScore !== null && ev.liveHomeScore !== '-';
            var isLiveOrDone = ev.liveStatus && ['in_play','live','ht','1h','2h','finished','ft'].includes((ev.liveStatus||'').toLowerCase());
            var statusInfo = ev.liveStatus ? getStatusDisplay(ev.liveStatus, ev.liveMinute, ev.liveHomeScore, ev.liveAwayScore) : null;

            var vsContent;
            if (isLiveOrDone && hasScore) {
                vsContent = '<div id="score-' + ev.idEvent + '" style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 20px;">' +
                    '<div style="font-size:2.2rem; font-weight:900; color:#fff; letter-spacing:3px; text-shadow: 0 0 20px rgba(255,255,255,0.3);">' + ev.liveHomeScore + ' - ' + ev.liveAwayScore + '</div>' +
                    '<div style="font-size:0.7rem; font-weight:700; color:' + (statusInfo ? statusInfo.color : '#aaa') + '; margin-top:4px;">' + (statusInfo ? statusInfo.label : '') + '</div>' +
                '</div>';
            } else {
                vsContent = '<div id="score-' + ev.idEvent + '" style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 30px;">' +
                    '<div style="font-size:2rem; font-weight:900; color:#fff; letter-spacing:1px; text-shadow: 0 0 15px rgba(255,255,255,0.2);">' + time + '</div>' +
                    '<div style="font-size:0.75rem; font-weight:700; color:var(--secondary); margin-top:5px; text-transform:uppercase;">بتوقيت مكة</div>' +
                '</div>';
            }

            var link = ev.customLink;

            html += '<a href="' + link + '" class="match-card">' +
                '<div style="width:100%; text-align:center;">' +
                    '<div style="font-size:0.9rem; color:var(--dim); margin-bottom:15px; display:flex; justify-content:center; align-items:center; gap:15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;">' +
                        '<span style="color:var(--secondary); font-weight:800;"><i class="fas fa-trophy" style="margin-left:5px;"></i>' + league + '</span>' +
                    '</div>' +
                    '<div class="match-teams" style="justify-content: center; margin-top: 10px;">' +
                        '<div class="team" style="flex:1; justify-content:flex-end; text-align:left; font-size:1.2rem;"><span>' + home + '</span>' + homeBadge + '</div>' +
                        vsContent +
                        '<div class="team" style="flex:1; justify-content:flex-start; text-align:right; font-size:1.2rem;">' + awayBadge + '<span>' + away + '</span></div>' +
                    '</div>' +
                '</div>' +
                '<div style="position:absolute; top:20px; left:25px;">' + badge + '</div>' +
            '</a>';
        });

        container.innerHTML = html;
    }

    loadMatches();
</script>
</body>
</html>
